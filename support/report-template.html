<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<style>
  :root {
    --bg: #f9fafb; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    --green: #166534; --green-bg: #dcfce7; --amber: #854d0e; --amber-bg: #fef9c3;
    --orange: #9a3412; --orange-bg: #ffedd5; --red: #991b1b; --red-bg: #fee2e2;
    --grey: #6b7280; --grey-bg: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
  header { background: #1e293b; color: #ffffff; padding: 2rem; }
  header h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .meta { font-size: 0.875rem; color: #cbd5e1; }
  .meta span { margin-right: 1.25rem; }
  main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  .banner { background: var(--amber-bg); color: var(--amber); border: 1px solid #fde68a; border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
  h2 { font-size: 1.125rem; margin-bottom: 1rem; }
  h3 { font-size: 0.95rem; margin: 1rem 0 0.5rem; }
  p, li { font-size: 0.875rem; }
  ul, ol { padding-left: 1.5rem; }
  code, .mono { font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
  th { text-align: left; padding: 0.5rem; background: #f1f5f9; border-bottom: 2px solid var(--border); }
  td { padding: 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .badge { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 9999px; font-weight: 600; font-size: 0.75rem; background: var(--grey-bg); color: var(--grey); }
  .tier-critical { background: var(--red-bg); color: var(--red); }
  .tier-high { background: var(--orange-bg); color: var(--orange); }
  .tier-medium { background: var(--amber-bg); color: var(--amber); }
  .tier-low { background: var(--green-bg); color: var(--green); }
  .tier-unknown { background: var(--grey-bg); color: var(--grey); }
  .band-strong { background: var(--green-bg); color: var(--green); }
  .band-adequate { background: var(--amber-bg); color: var(--amber); }
  .band-weak { background: var(--red-bg); color: var(--red); }
  .simulated { background: #e0e7ff; color: #3730a3; }
  .strip { display: flex; flex-wrap: wrap; gap: 0.75rem; }
  .strip-item { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.75rem 1rem; min-width: 14rem; background: var(--card); }
  .strip-item .name { font-weight: 600; margin-bottom: 0.4rem; word-break: break-all; }
  .score { text-align: center; font-weight: 600; }
  .score-green { background: var(--green-bg); color: var(--green); }
  .score-amber { background: var(--amber-bg); color: var(--amber); }
  .score-red { background: var(--red-bg); color: var(--red); }
  .score-grey { background: var(--grey-bg); color: var(--grey); }
  details { border: 1px solid var(--border); border-radius: 0.5rem; margin-bottom: 1rem; background: var(--card); }
  details details { margin: 0.5rem 0; }
  summary { padding: 0.75rem 1rem; cursor: pointer; font-weight: 600; }
  .details-body { padding: 1rem; border-top: 1px solid var(--border); }
  .rec { padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 0.5rem; font-size: 0.875rem; background: var(--grey-bg); border-left: 3px solid var(--grey); }
  .rec-p1, .rec-p2 { background: var(--red-bg); border-left-color: #ef4444; }
  .rec-p3, .rec-p4 { background: var(--amber-bg); border-left-color: #f59e0b; }
  .rec-p5, .rec-p6 { background: var(--green-bg); border-left-color: #22c55e; }
  .rec-head { font-weight: 600; margin-bottom: 0.25rem; }
  .why { color: var(--muted); }
  .evidence { font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; margin-top: 0.25rem; word-break: break-all; }
  .ok { color: #166534; font-weight: 700; }
  .bad { color: #991b1b; font-weight: 700; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<header>
{{header}}
</header>
<main>
{{banners}}
<section class="card">
<h2>Verdicts</h2>
{{verdict_strip}}
</section>
<section class="card">
<h2>Top issues across the run</h2>
{{top_issues}}
</section>
<section class="card">
<h2>Dashboard</h2>
{{dashboard}}
</section>
<section>
<h2>Skills</h2>
{{skill_sections}}
</section>
<section class="card">
<h2>Cross-skill patterns</h2>
{{patterns}}
</section>
<section class="card">
<h2>Method notes</h2>
{{method_notes}}
</section>
</main>
</body>
</html>
